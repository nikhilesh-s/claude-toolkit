name: media-unlocker-test

on:
  push:
    branches:
      - feat/media-unlocker
  pull_request:
    paths:
      - 'apps/media-unlocker/**'
      - '.github/workflows/media-unlocker-test.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/media-unlocker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile server
        run: python -m py_compile server.py smoke_test.py
      - name: Run smoke test
        run: python smoke_test.py
      - name: Validate shell syntax
        run: bash -n setup.sh && bash -n mediaunlock
